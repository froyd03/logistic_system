version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: logistic2_mysql
    environment:
      MYSQL_ROOT_PASSWORD: Froydbanatao-03
      MYSQL_DATABASE: logistic2_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    image: frdbntao/logistic2-backend:1.0
    container_name: logistic2_backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: logistic2_db
      DB_USER: root
      DB_PASSWORD: Froydbanatao-03
      JWT_SECRET: kmyeuOYb3nBM3a3U3gw9dQ0VQeIjLRMup1xzKjMznotjyeTFQL6zERn8DnvgY8va
      JWT_EXPIRE:  
    ports:
      - "5000:5000"
    volumes:  
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run seed && npm run dev"

  frontend:
    build: ./frontend
    image: frdbntao/logistic2-frontend:1.0
    container_name: logistic2_frontend
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm start"

volumes:
  mysql_data:
